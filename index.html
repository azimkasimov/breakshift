<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breakshift</title>
<link rel="icon" href="icon.png">
<style>
  :root { --ink: #e6e9ef; --soft: #9aa3b5; --bg: #0b0e14; --card: #141923; --accent: #ff9b2f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; text-align: center; }
  img { width: 128px; height: 128px; border-radius: 28px; }
  h1 { margin: 16px 0 4px; font-size: 34px; }
  p { color: var(--soft); }
  a { color: var(--accent); }
  .links a { display: inline-block; margin: 8px 12px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Breakshift app icon">
  <h1>Breakshift</h1>
  <p>Tactical ricochet: aim a volley, bounce it through living machines and brick walls, and watch them fall.<br>By FunnyBall Games.</p>
  <div class="links"><a href="support.html">Help and support</a> <a href="privacy-policy.html">Privacy policy</a></div>
</main>
</body>
</html>
